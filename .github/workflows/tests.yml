# Runs the tests of bayesian_inversion on every push and pull request. bayesian_inversion does not import pyheatmy, so
# it is installed alone; the tests that use the two packages together are in the MOLONARI-computo tree
# (integration_tests/, run with pixi run test-all at the root of the tree).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest Python of the environment of the MOLONARI-computo tree
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bayesian_inversion and pytest
        run: python -m pip install -e ".[test]"
      - name: Run the tests (those marked slow run an MCMC)
        run: python -m pytest tests

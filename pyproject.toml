[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian_inversion"
version = "0.2.0"
description = "Bayesian inversion tools (priors, DREAM proposal, energy, Gelman-Rubin diagnostic) and the MCMC inversion of a pyheatmy column"
readme = "README.md"
license =  {file = "LICENSE"}
authors = [
  {name = "Mathis Bourdin", email = "mathis.bourdin@mines-paristech.fr"},
  {name = "Youri Tchouboukoff", email = "youri.tchouboukoff@mines-paristech.fr"},
]
dependencies = [
    "numpy",
    "matplotlib",
    "psutil",
    "tqdm",
    "pyheatmy>=0.11",  # inversion_column only; not on PyPI: install it from its checkout first
]
requires-python = ">= 3.9"

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/YunusEmre4418/MOLONARI-bayesian-inversion"

[tool.setuptools]
packages = ["bayesian_inversion"]

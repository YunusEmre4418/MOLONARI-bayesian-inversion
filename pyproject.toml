[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian_inversion"
version = "0.4.2"
description = "MCMC estimation of the parameters of a model from its measurements: priors and state space, DREAM and random walk Metropolis samplers, energy, Gelman-Rubin diagnostic"
readme = "README.md"
license =  {file = "LICENSE"}
authors = [
  {name = "Mathis Bourdin", email = "mathis.bourdin@mines-paristech.fr"},
  {name = "Youri Tchouboukoff", email = "youri.tchouboukoff@mines-paristech.fr"},
]
dependencies = [
    "numpy",
    "tqdm",
]
requires-python = ">= 3.9"

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/YunusEmre4418/MOLONARI-bayesian-inversion"

[tool.setuptools]
packages = ["bayesian_inversion"]
